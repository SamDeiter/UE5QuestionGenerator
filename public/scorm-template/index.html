<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .choice-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .unselectable { -webkit-user-select: none; user-select: none; }
        .correct { background-color: #10b981 !important; border-color: #059669 !important; }
        .incorrect { background-color: #ef4444 !important; border-color: #dc2626 !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col unselectable">
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 id="quiz-title" class="text-xl font-bold text-blue-400">{{TITLE}}</h1>
            <div class="flex items-center space-x-6">
                <div class="text-right">
                    <div class="text-xs uppercase text-slate-400">Time</div>
                    <div id="countdown-timer" class="text-2xl font-mono font-bold text-blue-300">00:00</div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center p-4 md:p-8">
        <div class="w-full max-w-4xl">
            <!-- Progress -->
            <div class="mb-8">
                <div class="flex justify-between items-end mb-2">
                    <span id="progress-text" class="text-sm text-slate-400">Loading assessment...</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2">
                    <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <!-- Question Container -->
            <div id="question-container" class="space-y-6">
                <div class="bg-slate-800 rounded-lg p-6 shadow-xl border border-slate-700">
                    <div class="animate-pulse flex space-y-4 flex-col">
                        <div class="h-8 bg-slate-700 rounded w-3/4"></div>
                        <div class="h-12 bg-slate-700 rounded w-full"></div>
                        <div class="h-12 bg-slate-700 rounded w-full"></div>
                    </div>
                </div>
            </div>

            <!-- Results Container -->
            <div id="results-container" class="hidden"></div>
        </div>
    </main>

    <footer class="p-4 text-center text-slate-500 text-sm">
        &copy; 2024 UE5 Question Generator | SCORM 1.2 Compliant
    </footer>

    <script src="scorm.js" defer></script>
    <script src="questions.js" defer></script>
    <script src="game.js" defer></script>
</body>
</html>
