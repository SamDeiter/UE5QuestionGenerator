        }

          font-size: 0.875rem;
          color: #888;
          margin: 0;
        }

          content: "";
          animation: dots 1.5s steps(4, end) infinite;
        }

          0% {
            content: "";
          }
          25% {
            content: ".";
          }
          50% {
            content: "..";
          }
          75% {
            content: "...";
          }
        }
        @keyframes pulse {
          0%,
          100% {
            opacity: 1;
            transform: scale(1);
          }
          50% {
            opacity: 0.7;
            transform: scale(0.95);
          }
        }
