name: PR Checks

on:
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same PR when a new commit lands.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to v4.1.7 for supply chain security
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          # Fetch full history so gitleaks can scan back to the diverge
          # point. Without this, only the latest commit is on disk.
          fetch-depth: 0

      - name: Gitleaks secret scan
        # TODO: pin to SHA after Sam manually verifies a release SHA from
        # https://github.com/gitleaks/gitleaks-action/releases. The repo's
        # convention elsewhere is SHA-pinned actions. Tag-pinning is the
        # short-term acceptable step.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        # Pinned to v4.0.4 for supply chain security
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint check
        run: npm run lint

      - name: Run Tests
        run: npm test -- --run --reporter=verbose
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # Cloud Functions security suite (privilege-escalation, custom-claims,
      # invite, recent-auth). These are pure unit tests (no emulator/Java), so
      # they run cheaply here. Previously they existed but never ran in CI.
      - name: Run functions tests
        run: cd functions && npm test

      - name: Validate Firestore Rules
        run: node scripts/validate-firestore-rules.js
