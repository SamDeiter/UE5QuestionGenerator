name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npx vitest run --exclude="**/**.integration.test.{jsx,js}"
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Post-build bundle inspection
        run: |
          echo "🔍 Checking production bundle for forbidden secrets..."
          if grep -r "generativelanguage.googleapis.com" dist/assets/*.js; then
            echo "❌ FAIL: Direct Gemini API endpoint found in bundle"
            exit 1
          fi
          if grep -rP "AIza[A-Za-z0-9_-]{35}" dist/assets/*.js | grep -v "AIzaSyDHtXGk_e5ntXOqTBAr5whLnVU8LaWsqOQ"; then
            echo "❌ FAIL: Unauthorized API key found in bundle"
            exit 1
          fi
          echo "✅ Bundle inspection passed"
      - uses: FirebaseExtended/action-hosting-deploy@120e124148ab7016bec2374e5050f15051571a43 # v0.7.1
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_UE5_QUESTIONS_PROD }}"
          channelId: live
          projectId: ue5-questions-prod
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
