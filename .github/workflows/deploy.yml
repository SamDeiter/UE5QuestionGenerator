name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# NOTE: `contents: write` is broader than ideal — it grants push access to
# any branch including main. It's required here because the JamesIves
# github-pages-deploy-action pushes the built site to the gh-pages branch.
# To tighten further we would migrate to the official actions/deploy-pages
# flow (pages: write + id-token: write only). Tracked as a follow-up; not
# done in this PR to avoid bundling a deploy-mechanism change with
# hardening cleanup.
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to v4.1.7 for supply chain security
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        # Pinned to v2.3.9 — https://github.com/gitleaks/gitleaks-action/releases/tag/v2.3.9
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        # Pinned to v4.0.4 for supply chain security
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint check
        run: npm run lint

      - name: Run Tests
        run: npm test -- --run --reporter=verbose
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # Cloud Functions security suite (pure unit tests, no emulator/Java).
      - name: Run functions tests
        run: cd functions && npm test

      - name: Validate Firestore Rules
        run: node scripts/validate-firestore-rules.js

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # SECURITY: VITE_GEMINI_API_KEY removed - API key must NEVER be in client bundle
          # SECURITY: VITE_SUPER_ADMIN_EMAIL removed - prevents admin identity enumeration

      # Run the bundle-secret scan AFTER the build so dist/assets exists. In the
      # main test step above (pre-build) this test self-skips because dist is
      # absent, so without this step the "no Gemini API key in bundle" assertion
      # never actually fires.
      - name: Verify no secrets in built bundle
        run: npx vitest run tests/security/bundle-secrets.test.js
        env:
          # Lets the test value-match the one allowed AIza key against the real
          # public Firebase web key instead of relying only on the count check.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}

      - name: Deploy
        # Pinned to v4.6.3 for supply chain security
        uses: JamesIves/github-pages-deploy-action@65b5dfd4f5bcd3a7403bbc2959c144256167464e
        with:
          folder: dist
          branch: gh-pages
